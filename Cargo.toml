[workspace]
resolver = "2"
members = [
    "crates/transport/rrd-contract",
    "crates/transport/rrd-client",
    "crates/authority/rrd-engram",
    "crates/authority/rrd-security",
    "crates/authority/rrd-engine",
    "crates/transport/rrd-server",
    "crates/foundation/rrflow-kernel",
    "crates/compute/rrd-query",
    "crates/compute/rrflow-arrow",
    "crates/storage/rrflow-cld",
    "crates/storage/rrd-store",
    "crates/compute/rrd-vector",
    "crates/operations/rrd-operator-knowledge",
    "crates/operations/rrd-observation",
    "crates/compute/rrd-inference",
    "crates/compute/rrd-attunement",
    "crates/adapters/rrflow-edge",
    "crates/operations/rrd-cluster",
    "crates/operations/rrd-kubernetes",
    "crates/operations/rrd-maintenance",
    "crates/storage/rrflow-lsm",
    "crates/adapters/rrflow-cli",
    "crates/adapters/rrflow-mcp",
    "crates/evaluation/rrflow-evaluation-core",
    "crates/evaluation/lab/rrflow-lab-systems",
    "crates/evaluation/lab/rrflow-lab-datasets",
    "crates/evaluation/lab/rrflow-lab-benchmarks",
    "crates/evaluation/lab/rrflow-lab-evals",
    "crates/evaluation/lab/rrflow-lab-definitions",
    "crates/evaluation/lab/rrflow-lab",
    "crates/evaluation/lab/rrflow-lab-experiments",
    "crates/evaluation/qualification/rrflow-qualification-storage",
]

# Storage and query consume the engine-owned kernel. RrdEngine composes both.

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "BUSL-1.1"
repository = "https://github.com/rrflow/rrflow"
publish = false

[workspace.dependencies]
# Every first-party crate is declared here once; members write
# `workspace = true`. rrd-engine declares no default features here, so a
# member that wants the full engine names `default`.
rrd-attunement = { path = "crates/compute/rrd-attunement" }
rrd-client = { path = "crates/transport/rrd-client" }
rrd-cluster = { path = "crates/operations/rrd-cluster" }
rrd-contract = { path = "crates/transport/rrd-contract" }
rrd-engine = { path = "crates/authority/rrd-engine", default-features = false }
rrd-engram = { path = "crates/authority/rrd-engram" }
rrd-inference = { path = "crates/compute/rrd-inference" }
rrflow-lsm = { path = "crates/storage/rrflow-lsm" }
rrd-observation = { path = "crates/operations/rrd-observation" }
rrd-operator-knowledge = { path = "crates/operations/rrd-operator-knowledge" }
rrd-query = { path = "crates/compute/rrd-query" }
rrd-security = { path = "crates/authority/rrd-security" }
rrd-server = { path = "crates/transport/rrd-server" }
rrd-store = { path = "crates/storage/rrd-store" }
rrd-vector = { path = "crates/compute/rrd-vector" }
rrflow-arrow = { path = "crates/compute/rrflow-arrow" }
rrflow-cld = { path = "crates/storage/rrflow-cld" }
rrflow-evaluation-core = { path = "crates/evaluation/rrflow-evaluation-core" }
rrflow-kernel = { path = "crates/foundation/rrflow-kernel" }
rrflow-lab-benchmarks = { path = "crates/evaluation/lab/rrflow-lab-benchmarks" }
rrflow-lab-datasets = { path = "crates/evaluation/lab/rrflow-lab-datasets" }
rrflow-lab-definitions = { path = "crates/evaluation/lab/rrflow-lab-definitions" }
rrflow-lab-evals = { path = "crates/evaluation/lab/rrflow-lab-evals" }
rrflow-lab-systems = { path = "crates/evaluation/lab/rrflow-lab-systems" }
rrflow-qualification-storage = { path = "crates/evaluation/qualification/rrflow-qualification-storage" }
serde = { version = "1", features = ["derive"] }
# A count or digest over a float is checked after the wire, so parsing has to be exact.
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.8"
# Step T: spans at subsystem boundaries, zero-cost with no subscriber
# installed. The kernel (rrflow-kernel) stays out: serde and pure hashing only.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
unicode-normalization = "0.1"

# Release builds (benchmarks and shipped binaries) optimize across crate
# boundaries so shared generic code is compiled once, not once per crate.
# Thin LTO keeps codegen parallel; symbols and panic unwinding are unchanged.
[profile.release]
lto = "thin"

# Native debug lifecycle fixtures still hash the entire actual executable.
# Optimize the pinned compression implementation without disabling development
# assertions, overflow checks, identity verification or application debugging.
[profile.dev.package.sha2]
opt-level = 3

# Observation symbols only: semantic settings inherit release unchanged.
[profile.diagnostic]
inherits = "release"
debug = "line-tables-only"
strip = "none"
