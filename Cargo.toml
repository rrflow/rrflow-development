[workspace]
resolver = "2"
members = [
    "rrd/contract",
    "rrd/client",
    "rrflow/engram",
    "rrflow/security",
    "rrd/engine",
    "rrd/server",
    "rrflow/core",
    "rrflow/ql",
    "rrflow/arrow",
    "rrflow/cld",
    "rrflow/db",
    "rrflow/vector",
    "rrflow/knowledge",
    "rrflow/observability",
    "rrflow/inference",
    "rrflow/attunement",
    "rrflow/edge",
    "rrflow/cx",
    "rrflow/cx-operator",
    "rrflow/lsm",
    "rrflow/cli",
    "rrflow/mcp",
    "lab/core",
    "lab/systems",
    "lab/datasets",
    "lab/benchmarks",
    "lab/evals",
    "lab/definitions",
    "lab/runner",
    "lab/experiments",
    "lab/qualification-storage",
]

# Storage and query consume the engine-owned kernel. RrdEngine composes both.

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "BUSL-1.1"
repository = "https://github.com/rrflow/rrflow"
publish = false

[workspace.dependencies]
# Every first-party crate is declared here once; members write
# `workspace = true`. rrd-engine declares no default features here, so a
# member that wants the full engine names `default`.
rrflow-attunement = { path = "rrflow/attunement" }
rrd-client = { path = "rrd/client" }
rrflow-cx = { path = "rrflow/cx" }
rrd-contract = { path = "rrd/contract" }
rrd-engine = { path = "rrd/engine", default-features = false }
rrflow-engram = { path = "rrflow/engram" }
rrflow-inference = { path = "rrflow/inference" }
rrflow-lsm = { path = "rrflow/lsm" }
rrflow-observability = { path = "rrflow/observability" }
rrflow-knowledge = { path = "rrflow/knowledge" }
rrflow-ql = { path = "rrflow/ql" }
rrflow-security = { path = "rrflow/security" }
rrd-server = { path = "rrd/server" }
rrflow-db = { path = "rrflow/db" }
rrflow-vector = { path = "rrflow/vector" }
rrflow-arrow = { path = "rrflow/arrow" }
rrflow-cld = { path = "rrflow/cld" }
rrflow-lab-core = { path = "lab/core" }
rrflow-core = { path = "rrflow/core" }
rrflow-lab-benchmarks = { path = "lab/benchmarks" }
rrflow-lab-datasets = { path = "lab/datasets" }
rrflow-lab-definitions = { path = "lab/definitions" }
rrflow-lab-evals = { path = "lab/evals" }
rrflow-lab-systems = { path = "lab/systems" }
rrflow-lab-qualification-storage = { path = "lab/qualification-storage" }
serde = { version = "1", features = ["derive"] }
# A count or digest over a float is checked after the wire, so parsing has to be exact.
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.8"
# Step T: spans at subsystem boundaries, zero-cost with no subscriber
# installed. The kernel (rrflow-core) stays out: serde and pure hashing only.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
unicode-normalization = "0.1"

# Release builds (benchmarks and shipped binaries) optimize across crate
# boundaries so shared generic code is compiled once, not once per crate.
# Thin LTO keeps codegen parallel; symbols and panic unwinding are unchanged.
[profile.release]
lto = "thin"

# Native debug lifecycle fixtures still hash the entire actual executable.
# Optimize the pinned compression implementation without disabling development
# assertions, overflow checks, identity verification or application debugging.
[profile.dev.package.sha2]
opt-level = 3

# Observation symbols only: semantic settings inherit release unchanged.
[profile.diagnostic]
inherits = "release"
debug = "line-tables-only"
strip = "none"
