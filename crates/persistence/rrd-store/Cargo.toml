[package]
name = "rrd-store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "RRFlow storage semantics for persistent rrflowKV and volatile rrflowMX."

[features]
crash-test = ["rrd-lsm/crash-test"]
# A comparison baseline only: a second physical backend for the storage
# differentials and the native-versus-Fjall benchmarks. No production crate
# enables it, and the engine composition never selects it.
fjall-baseline = ["dep:fjall"]
# Reference modules behind the columnar port: proven outside formats to compare
# rrflowCLD with and learn from. Neither is the product, and no production
# crate enables either.
parquet-reference = ["dep:parquet", "dep:arrow-array", "dep:arrow-cast", "dep:arrow-schema", "dep:bytes"]
vortex-reference = ["dep:vortex", "dep:arrow-array", "dep:arrow-cast", "dep:arrow-schema"]

[dependencies]
rrd-core = { path = "../../kernel/rrd-core" }
rrd-lsm = { path = "../rrd-lsm" }
serde = { workspace = true }
serde_json = { workspace = true }
unicode-normalization = { workspace = true }
sha2 = "0.11"
tracing = { workspace = true }
fjall = { version = "=3.1.8", optional = true }
parquet = { version = "=59.2.0", default-features = false, features = ["arrow", "zstd"], optional = true }
vortex = { version = "=0.93.0", default-features = false, features = ["files"], optional = true }
arrow-array = { version = "=59.2.0", optional = true }
arrow-cast = { version = "=59.2.0", optional = true }
arrow-schema = { version = "=59.2.0", optional = true }
bytes = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"
tracing-subscriber = { workspace = true }

# Child process for tests/durability.rs. Declared as a bin so integration tests
# receive its path through CARGO_BIN_EXE_durability-child.
[[bin]]
name = "durability-child"
path = "src/bin/durability-child.rs"

# The comparison harness needs the Fjall baseline backend.
[[example]]
name = "storage_comparison"
path = "examples/storage_comparison.rs"
required-features = ["fjall-baseline"]

# The columnar comparison needs both reference modules.
[[example]]
name = "columnar_comparison"
path = "examples/columnar_comparison.rs"
required-features = ["parquet-reference", "vortex-reference"]
