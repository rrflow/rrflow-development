[package]
name = "rrd-lsm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Native RRD storage engine: versioned WAL, MVCC, segments, and manifests."

[features]
default = []
physical-policy-lab = ["dep:lz4_flex", "dep:zstd"]

[dependencies]
rrd-core = { path = "../../kernel/rrd-core" }
serde = { workspace = true }
serde_json = { workspace = true }
crc32c = "=0.6.8"
ring = "=0.17.14"
memmap2 = "=0.9.11"
tracing = { workspace = true }
arrow-buffer = "=59.2.0"
lz4_flex = { version = "=0.14.0", optional = true }
zstd = { version = "=0.13.3", default-features = false, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.189"
io-uring = "=0.7.14"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

[[example]]
name = "rrflowkv-physical-policy"
path = "examples/rrflowkv_physical_policy.rs"
required-features = ["physical-policy-lab"]
