[package]
name = "rrflow-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "stdio MCP adapter for the RRFlow reasoning runtime"

[dependencies]
rrd-client = { path = "../transport/rrd-client" }
rrd-contract = { path = "../transport/rrd-contract" }
rrd-engine = { path = "../authority/rrd-engine" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt", "time"] }

[dev-dependencies]
rrd-core = { path = "../kernel/rrd-core" }
rrd-security = { path = "../authority/rrd-security" }
rrd-server = { path = "../transport/rrd-server" }
rrd-store = { path = "../persistence/rrd-store" }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[[bin]]
name = "rrflow-mcp"
path = "src/main.rs"
