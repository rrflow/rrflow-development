[package]
name = "rrflow-eval"
default-run = "rrflow-eval"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "controlled, paired frontier-runtime evaluation harness"

[dependencies]
ed25519-dalek = "=3.0.0"
getrandom = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
rrd-contract = { path = "../../transport/rrd-contract" }
rrd-client = { path = "../../transport/rrd-client" }
rrflow-evaluation-core = { path = "../rrflow-evaluation-core" }
rrflow-lab-benchmarks = { path = "../lab/rrflow-lab-benchmarks" }
rrflow-lab-datasets = { path = "../lab/rrflow-lab-datasets" }
rrflow-lab-systems = { path = "../lab/rrflow-lab-systems" }
schemars = "1.2"
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread"] }
ureq = { version = "=3.4.2", default-features = false }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "rrflow-eval"
path = "src/main.rs"

[[bin]]
name = "rrflow-lab"
path = "src/bin/rrflow_lab.rs"
