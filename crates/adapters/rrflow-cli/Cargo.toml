[package]
name = "rrflow-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "rrflow operator surface: explicit, recorded invocation of every trigger."

[dependencies]
rrd-engine = { path = "../../authority/rrd-engine" }
rrd-contract = { path = "../../transport/rrd-contract" }
rrd-client = { path = "../../transport/rrd-client" }
clap = { version = "4", features = ["derive", "env"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
sha2 = "0.11"
sysinfo = "0.39.6"
tokio = { version = "1", features = ["rt", "time"] }

[dev-dependencies]
tempfile = "3"
rrd-core = { path = "../../kernel/rrd-core" }
rrd-store = { path = "../../persistence/rrd-store" }
rrd-lsm = { path = "../../persistence/rrd-lsm" }
rrd-security = { path = "../../authority/rrd-security" }
rrd-estate = { path = "../../authority/rrd-estate" }
rrd-server = { path = "../../transport/rrd-server" }

[[bin]]
name = "rrflow"
path = "src/main.rs"
