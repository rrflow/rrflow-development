[package]
name = "rrd-attunement"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Pure deterministic source inventory proposals for RRFlow."

[dependencies]
rrd-core = { path = "../../kernel/rrd-core" }
serde = { workspace = true }
serde_json = { workspace = true }
gix-index = { version = "=0.58.0", default-features = false, features = ["sha1", "sha256"] }
gix-ignore = { version = "=0.24.1", default-features = false }
gix-config = { version = "=0.62.2", default-features = false, features = ["sha1", "sha256"] }
filetime = "=0.2.29"
tree-sitter = "=0.24.7"
tree-sitter-rust = "=0.23.3"
tree-sitter-python = "=0.23.6"
tree-sitter-go = "=0.23.4"
