[package]
name = "rrd-attunement"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Pure deterministic source inventory proposals for RRFlow."

[dependencies]
rrd-core = { path = "../../kernel/rrd-core" }
serde = { workspace = true }
serde_json = { workspace = true }
gix-index = { version = "=0.58.0", default-features = false, features = ["sha1", "sha256"] }
gix-ignore = { version = "=0.24.1", default-features = false }
filetime = "=0.2.29"
