[[crate]]
name = "rrflow-lab-evals"
tier = "evaluation"
folder = "crates/evaluation/lab"

[[crate]]
name = "rrflow-lab-definitions"
tier = "evaluation"
folder = "crates/evaluation/lab"

[[crate]]
name = "rrflow-lab"
tier = "evaluation"
folder = "crates/evaluation/lab"

[[crate]]
