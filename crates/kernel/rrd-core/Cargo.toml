[package]
name = "rrd-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "RRFlow kernel: bi-temporal claims, key encoding, supersession. No transport, no policy, no storage engine."

# rrd-core must compile and test with every outer layer removed.
# It must never depend on a concrete storage engine, transport, or tier policy.
[dependencies]
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
