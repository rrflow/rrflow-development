name: Temporary macOS cache identity diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Isolate macOS reopen toolchain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          toolchain_home="${RUNNER_TEMP}/rrflow-reopen-rustup"
          test ! -e "$toolchain_home"
          printf 'RUSTUP_HOME=%s\n' "$toolchain_home" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: installed-reopen-macos-latest
          cache-on-failure: false
      - name: Build small cache input
        run: cargo build --locked -p rrd-core
