name: C-07 native capture diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  native-capture:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: installed-crash-macos-latest
          cache-on-failure: false
      - name: Build ordinary primary
        run: cargo build -p rrflow-cli --bin rrflow --locked
      - name: Build diagnostic primary and installed oracle
        run: cargo test -p rrflow-cli --test installed_crash --features crash-test --locked --no-run
      - name: Run exact repeated APFS cases once
        timeout-minutes: 15
        env:
          RRFLOW_CAPACITY_DIAGNOSTICS: ${{ runner.temp }}/rrflow-capacity-diagnostics
        run: >-
          python3 scripts/ci/run_native_capacity.py
          --mode fresh --mode existing --mode fresh --mode existing
          --mode fresh --mode existing
      - name: Retain bounded failure receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-pipe-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rrflow-capacity-diagnostics/*.json
          if-no-files-found: ignore
          retention-days: 14
