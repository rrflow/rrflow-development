name: Temporary C-07 checked-in native failure preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-failure-preflight:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Verify exact revision and native failure capture
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
          python3 scripts/ci/test_macos_native_failure_preflight.py
          python3 scripts/ci/macos_native_failure_preflight.py
      - name: Retain injected native failure receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-failure-checked-in-helper
          path: ${{ runner.temp }}/rrflow-native-failure-probe/rrflow-capacity-diagnostics/*.json
          if-no-files-found: error
          retention-days: 14
