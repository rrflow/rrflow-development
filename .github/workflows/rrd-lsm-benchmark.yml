name: Temporary C-07 native failure capture experiment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-failure-capture:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Exercise native create failure and capture
        env:
          RRFLOW_CAPACITY_DIAGNOSTICS: ${{ runner.temp }}/rrflow-capacity-diagnostics
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
          python3 - <<'PY'
          import json, os, sys, tempfile
          from pathlib import Path
          sys.path.insert(0, 'scripts/ci')
          import run_native_capacity as runner
          assert sys.platform == 'darwin'
          fixture = Path(tempfile.mkdtemp(prefix='rrflow-capacity-')).resolve(strict=True)
          config = {'modes': ['fresh', 'existing'], 'points': list(runner.POINTS),
                    'size_mib': 256, 'executable': 'not-run', 'harness_sha256': '0' * 64}
          original = runner.native_command
          calls = []
          def invalid_filesystem(*args, **kwargs):
              assert args[:2] == ('hdiutil', 'create')
              calls.append(args[:2])
              altered = list(args)
              altered[altered.index('-fs') + 1] = 'RRFLOW_INVALID_FILESYSTEM'
              return original(*altered, **kwargs)
          runner.native_command = invalid_filesystem
          try:
              runner.cases(config, fixture)
          except runner.NativeCommandFailure as error:
              assert (error.tool, error.verb) == ('hdiutil', 'create') and error.returncode != 0
          else:
              raise AssertionError('invalid native create unexpectedly succeeded')
          assert len(calls) == 1, 'subsequent cases must not run'
          files = list(Path(os.environ['RRFLOW_CAPACITY_DIAGNOSTICS']).glob('*.json'))
          assert len(files) == 1
          receipt = json.loads(files[0].read_text(encoding='utf-8'))
          assert (receipt['mode'], receipt['point'], receipt['case_index']) == ('fresh', runner.POINTS[0], 1)
          assert (receipt['tool'], receipt['verb']) == ('hdiutil', 'create')
          assert receipt['returncode'] != 0 and receipt['github_sha'] == os.environ['GITHUB_SHA']
          assert receipt['stderr_head'] or receipt['stdout_head']
          assert receipt['cleanup_state'] == 'unknown'
          assert files[0].stat().st_size <= 256 * 1024
          assert not (fixture / 'capacity.dmg').exists(), 'unexpected native image; fixture retained'
          runner.cleanup_detached_volume(fixture)
          fixture.rmdir()
          print('native_failure_capture=verified; actual_hdiutil=true; capacity_pass=false; fixture_cleanup=complete')
          PY
      - name: Retain bounded native failure receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-failure-capture-experiment
          path: ${{ runner.temp }}/rrflow-capacity-diagnostics/*.json
          if-no-files-found: error
          retention-days: 14
