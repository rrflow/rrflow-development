name: C-07 macOS native capacity preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-preflight:
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: macos-native-capacity-preflight-debug0
          cache-on-failure: false
      - name: Bind exact revision and test harness
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
          python3 scripts/ci/test_native_capacity.py
          python3 scripts/ci/test_macos_native_failure_preflight.py
      - name: Verify real native create-failure capture
        run: python3 scripts/ci/macos_native_failure_preflight.py
      - name: Retain injected native failure receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-failure-capture-injected
          path: ${{ runner.temp }}/rrflow-native-failure-probe/rrflow-capacity-diagnostics/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Run required APFS repetitions as preflight
        timeout-minutes: 30
        env:
          RRFLOW_CAPACITY_DIAGNOSTICS: ${{ runner.temp }}/rrflow-capacity-diagnostics
        run: >-
          python3 scripts/ci/run_native_capacity.py
          --mode fresh --mode existing --mode fresh --mode existing
          --mode fresh --mode existing
      - name: Retain native capacity create diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-capacity-preflight-diagnostics
          path: ${{ runner.temp }}/rrflow-capacity-diagnostics/*.json
          if-no-files-found: ignore
          retention-days: 14
