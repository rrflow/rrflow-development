[package]
name = "rrd-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "RRFlow composition root and authoritative embedded RRD engine API."

[[example]]
name = "refresh_sdk_installation_identity"
required-features = ["full"]

[features]
default = ["full"]
cld-vortex = ["full", "rrflow-cld/cld-vortex"]
cld-parquet = ["full", "rrflow-cld/cld-parquet"]
crash-test = ["full", "rrflow-db/crash-test"]
cluster-transfer = ["full", "rrflow-cx/openraft-adapter"]
edge = [
    "dep:rrflow-inference",
    "dep:rrflow-vector",
    "dep:serde",
    "dep:serde_json",
]
full = [
    "edge",
    "rrflow-inference/endpoint-chat",
    "dep:rrflow-attunement",
    "dep:base64",
    "dep:rrflow-cx",
    "dep:rrd-contract",
    "dep:rrflow-engram",
    "dep:rrflow-knowledge",
    "dep:rrflow-observability",
    "dep:rrflow-ql",
    "dep:rrflow-cld",
    "dep:rrflow-security",
    "dep:rrflow-db",
    "dep:rquickjs",
    "dep:getrandom",
    "dep:libc",
    "dep:windows-sys",
    "dep:hmac",
    "dep:schemars",
    "dep:sha2",
    "dep:toml",
    "dep:tracing",
    "dep:wasmi",
]

[dependencies]
rrflow-cld = { workspace = true, optional = true }
rrflow-attunement = { workspace = true, optional = true }
rrd-contract = { workspace = true, optional = true }
rrflow-engram = { workspace = true, optional = true }
rrflow-security = { workspace = true, optional = true }
rrflow-core.workspace = true
rrflow-ql = { workspace = true, optional = true }
rrflow-db = { workspace = true, optional = true }
rrflow-vector = { workspace = true, optional = true }
rrflow-inference = { workspace = true, optional = true }
rrflow-knowledge = { workspace = true, optional = true }
rrflow-observability = { workspace = true, optional = true }
rrflow-cx = { workspace = true, features = ["object-transfer"], optional = true }
base64 = { version = "0.22", optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
schemars = { version = "1.2", optional = true }
hmac = { version = "0.13", optional = true }
sha2 = { version = "0.11", optional = true }
getrandom = { version = "0.3", optional = true }
rquickjs = { version = "0.12.2", default-features = false, optional = true }
wasmi = { version = "1.1.0", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_Pipes", "Wdk_Foundation", "Wdk_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
toml = { workspace = true }
parquet = { version = "=59.2.0", default-features = false, features = ["arrow", "zstd"] }
tracing-subscriber = { workspace = true }
wat = "1"
