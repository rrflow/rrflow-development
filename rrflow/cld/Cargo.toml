[package]
name = "rrflow-cld"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "RRFlow immutable columnar history, physical codecs and bounded interchange."

[features]
default = ["cld-parquet"]
cld-parquet = ["dep:parquet"]
cld-vortex = ["dep:vortex"]

[dependencies]
rrflow-core.workspace = true
serde.workspace = true
serde_json.workspace = true
rrflow-arrow = { workspace = true }
arrow-array = "=59.2.0"
arrow-schema = "=59.2.0"
arrow-cast = "=59.2.0"
bytes = "1"
parquet = { version = "=59.2.0", default-features = false, features = ["arrow", "zstd"], optional = true }
vortex = { version = "=0.93.0", default-features = false, features = ["files"], optional = true }

[[bench]]
name = "columnar"
harness = false

[dev-dependencies]
rrflow-db = { workspace = true }
tempfile = "3"
