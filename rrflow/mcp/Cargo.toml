[package]
name = "rrflow-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "stdio MCP adapter for the RRFlow reasoning runtime"

[dependencies]
rrd-client = { workspace = true }
rrd-contract = { workspace = true }
rrd-engine = { workspace = true, features = ["default"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt", "time"] }

[dev-dependencies]
rrflow-core = { workspace = true }
rrflow-security = { workspace = true }
rrd-server = { workspace = true }
rrflow-db = { workspace = true }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[[bin]]
name = "rrflow-mcp"
path = "src/main.rs"
